fr:
  availability: "Je collabore avec des organisations et des équipes d'ingénierie sur l'infrastructure IA, la Data Governance, le MLOps et les architectures backend haute performance."
  org_intro: "Les organisations avec lesquelles j'ai collaboré incluent : "
  org_others: " et d'autres."
  pillars_title: "Domaines d'expertise"
  pillars:
    - title: "Infrastructure IA & Data Governance"
      items:
        - "Conception d'architectures IA & LLM auto-hébergées."
        - "Anonymisation des données personnelles, coffres-forts de données et pipelines RAG (pgvector, PostGIS)."
        - "MLOps et déploiement de modèles de Computer Vision (YOLO, PyTorch)."
    - title: "Backend haute performance & System Design"
      items:
        - "Conception de systèmes distribués scalables et d'APIs à fort débit (Rust, Python, TypeScript)."
        - "Architecture de bases de données, optimisation de requêtes et intégration géospatiale (PostgreSQL)."
        - "Outillage interne sur mesure (CLI, environnements de développement sans conteneur)."
    - title: "Mentorat technique & formation d'équipes"
      items:
        - "Formation d'équipes d'ingénierie à l'intégration moderne de l'IA, à Rust et au System Design."
        - "Revues de code, audits d'architecture et montée en compétence des développeurs juniors/intermédiaires."
  testimonial_title: "Témoignages :"
  testimonial_at: "chez"
  organizations: *organizations
  testimonials:
    - &testimonial_kone_fanhatcha
      avatar: "/assets/avatars/kone-fanhatcha.png"
      author: "Koné Fanhatcha"
      author_url: "https://www.linkedin.com/in/konefanhatcha/"
      role: "Directeur de l'ingénierie & CTO"
      company: "Edane SA"
      company_url: "https://edane.org/site/index.html"
      quote: "Rigoureux, curieux et techniquement solide, Sana a grandement contribué à la réussite de nos projets de développement. Il possède une excellente méthodologie de travail et s'intègre parfaitement au sein d'une équipe agile. Son esprit d'analyse et sa communication fluide en font un maillon fort pour mener à bien des projets tech ambitieux. Un profil de confiance à recruter sans hésiter."
      highlight: "Rigoureux, curieux et techniquement solide... un maillon fort pour mener à bien des projets tech ambitieux."
    - &testimonial_narcisse_adingra
      avatar: "/assets/avatars/narcisse-adingra.jpg"
      author: "Narcisse Adingra"
      author_url: "https://www.linkedin.com/in/narcisse-adingra-700907a1/"
      role: "CTO & Co-fondateur"
      company: "Djeli"
      company_url: "https://sites.djeli.pro/"
      quote: "J'ai eu l'occasion de collaborer avec Sana sur plusieurs projets techniques. Il a rapidement identifié des problèmes de performance de notre infrastructure et conçu des optimisations qui ont amélioré la rapidité et l'efficacité de nos systèmes. Il a également développé une solution d'intelligence artificielle parfaitement adaptée à nos besoins. Son sens de l'analyse, sa rigueur et sa capacité à transformer des défis complexes en solutions concrètes en font un ingénieur avec lequel je recommande de travailler."
      highlight: "Il a rapidement identifié des problèmes de performance de notre infrastructure et conçu des optimisations qui ont amélioré la rapidité et l'efficacité de nos systèmes."
    - &testimonial_aka_laurent
      author: "Aka Laurent"
      avatar: "/assets/avatars/aka-laurent.jpg"
      author_url: "https://www.linkedin.com/in/aka-laurent-278aa6256/"
      role: "Ingénieur Full Stack / IA"
      company: "Talenteum.com"
      company_url: "https://talenteum.com/"
      quote: "J'ai connu Sana il y a plus de 2 ans, alors que j'étais encore cofondateur / CTO de Freeci. Il a rejoint la plateforme et j'ai été content de constater qu'il existe des développeurs avec de bons soft skills, mais aussi une réelle fibre pour les bonnes pratiques. C'est un excellent ingénieur que je recommanderais les yeux fermés pour vos projets."
    - &testimonial_israel_kouassi
      avatar: "/assets/avatars/israel-kouassi.png"
      author: "Israël KOUASSI"
      author_url: "https://www.linkedin.com/in/isra%C3%ABl-kouassi-b66919182/"
      role: "Ingénieur Étude Informatique"
      company: "GS2E"
      company_url: "https://gs2e.ci/"
      quote: >-
        J'ai la chance de connaître Sana Yavo, que j'appelle <em>Optimazer</em>.
        S'il y a une chose qui le définit, c'est son obsession de l'optimisation.

        Avec lui, tout est pensé pour être plus rapide, plus efficace et mieux conçu : de la vitesse d'exécution d'une application jusqu'à la concrétisation d'une idée en un temps record.
        C'est un véritable cocktail de geek, curieux, créatif et toujours à la recherche de la meilleure solution.

        C'est aussi un véritable <em>soldat</em>, un fer de lance lorsqu'il s'agit d'épurer, d'améliorer et de rendre une application plus scalable.
        Là où certains voient une application qui fonctionne, Sana voit encore ce qui peut être optimisé.

        Le monde a connu la compression, moi, j'ai connu Sana Yavo (<em>Optimazer</em>).
      highlight: "Le monde a connu la compression, moi, j'ai connu Sana Yavo (Optimazer)."

en:
  availability: "I partner with organizations and engineering teams on AI Infrastructure, Data Governance, MLOps, and High-Performance Backend Architectures."
  org_intro: "Organizations I’ve worked with include: "
  org_others: " and others."
  pillars_title: "Areas of expertise"
  pillars:
    - title: "AI Infrastructure & Data Governance"
      items:
        - "Designing self-hosted AI & LLM architectures."
        - "Implementing PII anonymization, data privacy vaults, and RAG pipelines (pgvector, PostGIS)."
        - "MLOps and Computer Vision model deployments (YOLO, PyTorch)."
    - title: "High-Performance Backend & System Design"
      items:
        - "Building scalable distributed systems and high-throughput APIs (Rust, Python, TypeScript)."
        - "Database architecture, query optimization, and geodata integration (PostgreSQL)."
        - "Custom internal tooling (CLI tools, containerless development environments)."
    - title: "Technical Mentorship & Team Training"
      items:
        - "Training engineering teams on modern AI integration, Rust, and System Design."
        - "Code reviews, architectural audits, and levelling up junior/mid-level developers."
  testimonial_title: "Testimonials:"
  testimonial_at: "at"
  organizations: *organizations
  testimonials:
    - <<: *testimonial_kone_fanhatcha
      role: "Director of engineering & CTO"
      quote: "Rigorous, curious, and technically solid, Sana greatly contributed to the success of our development projects. He has an excellent working methodology and integrates perfectly into an agile team. His analytical mind and fluid communication make him a strong asset in successfully completing ambitious tech projects. A trustworthy professional to hire without hesitation."
      highlight: "Rigorous, curious, and technically solid... a strong asset in successfully completing ambitious tech projects."
    - <<: *testimonial_narcisse_adingra
      role: "CTO & Co-founder"
      quote: "I had the opportunity to collaborate with Sana on several technical projects. He quickly identified performance issues in our infrastructure and designed optimizations that improved the speed and efficiency of our systems. He also developed an AI solution perfectly suited to our needs. His analytical mindset, rigor, and ability to turn complex challenges into concrete solutions make him an engineer I recommend working with."
      highlight: "He quickly identified performance issues in our infrastructure and designed optimizations that improved the speed and efficiency of our systems."
    - <<: *testimonial_aka_laurent
      role: "Full Stack / AI Engineer"
      quote: "I met Sana over 2 years ago, when I was still cofounder / CTO at Freeci. He joined the platform, and I was glad to see there are developers with strong soft skills who also have a genuine knack for best practices. He's an excellent engineer whom I'd recommend without hesitation for your projects."
    - <<: *testimonial_israel_kouassi
      role: "Software Engineer"
      quote: >-
        I have the privilege of knowing Sana Yavo, whom I call the <em>Optimizer</em>.
        If there's one thing that defines him, it's his obsession with optimization.

        With him, everything is designed to be faster, more efficient, and better built: from an application's execution speed to turning an idea into reality in record time.
        He's a true blend of geek, curiosity, and creativity, always searching for the best solution.

        He's also a real <em>soldier</em>, a spearhead when it comes to streamlining, improving, and making an application more scalable.
        Where some see a working application, Sana still sees what can be optimized.

        The world got compression; I got to know Sana Yavo (the <em>Optimizer</em>).
      highlight: "The world got compression; I got to know Sana Yavo (the Optimizer)."
